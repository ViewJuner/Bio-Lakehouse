services:
  mysql:
    image: mysql:8.0
    container_name: bio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biolake
      MYSQL_USER: bio
      MYSQL_PASSWORD: bio
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.2
    container_name: bio-kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.7.2
    container_name: bio-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vitals.raw --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vitals.validated --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
        echo "topics ready"

  minio:
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: bio-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 minioadmin minioadmin && break
          sleep 2
        done
        mc mb -p local/lakehouse || true
        echo "bucket ready"

  nifi:
    image: apache/nifi:1.25.0
    container_name: bio-nifi
    ports:
      - "8081:8080"
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_WEB_HTTPS_PORT: ""
      NIFI_WEB_HTTP_HOST: 0.0.0.0
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminadminadmin
    volumes:
      - ./nifi/flow.json:/opt/nifi/flow-import/flow.json:ro
      - ./nifi/HUONG-DAN-IMPORT.md:/opt/nifi/flow-import/HUONG-DAN-IMPORT.md:ro
    depends_on:
      kafka:
        condition: service_healthy

  hbase:
    image: harisekhon/hbase:latest
    platform: linux/amd64
    container_name: bio-hbase
    ports:
      - "16010:16010"
      - "9090:9090"
      - "8085:8080"
    volumes:
      - ./hbase/init.txt:/init.txt:ro

  generator:
    build: ./generator
    container_name: bio-generator
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: vitals.raw
      INTERVAL_SEC: "1"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  nifi-etl:
    build: ./nifi
    container_name: bio-nifi-etl
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      IN_TOPIC: vitals.raw
      OUT_TOPIC: vitals.validated
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  spark:
    build: ./spark
    container_name: bio-spark
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      IN_TOPIC: vitals.validated
      MYSQL_HOST: mysql
      MYSQL_DB: biolake
      MYSQL_USER: bio
      MYSQL_PASSWORD: bio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: lakehouse
      HBASE_REST: http://hbase:8080
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      hbase:
        condition: service_started
      nifi-etl:
        condition: service_started

  rules:
    build: ./rules
    container_name: bio-rules
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      IN_TOPIC: vitals.validated
      ALERT_TOPIC: alerts
      MYSQL_HOST: mysql
      MYSQL_DB: biolake
      MYSQL_USER: bio
      MYSQL_PASSWORD: bio
      THRESHOLDS_PATH: /app/thresholds.yaml
    volumes:
      - ./rules/thresholds.yaml:/app/thresholds.yaml
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      nifi-etl:
        condition: service_started

  dashboard:
    build: ./dashboard
    container_name: bio-dashboard
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DB: biolake
      MYSQL_USER: bio
      MYSQL_PASSWORD: bio
      THRESHOLDS_PATH: /app/thresholds.yaml
    volumes:
      - ./rules/thresholds.yaml:/app/thresholds.yaml
    depends_on:
      mysql:
        condition: service_healthy
